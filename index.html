<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Girlhood Planner | Welcome</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body class="login-page">

    <main class="login-container">
        <section class="login-card">
            <div class="logo">♡</div>
            <h1>Girlhood Planner</h1>
            <p class="subtitle">A little space to organize your big dreams.</p>

            <div class="auth-tabs">
                <button type="button" class="tab-button active" data-auth="login">
                    Log In
                </button>
                <button type="button" class="tab-button" data-auth="register">
                    Create Account
                </button>
            </div>

            <form id="loginForm" class="auth-form">
                <label for="loginUsername">Username</label>
                <input type="text" id="loginUsername" placeholder="Enter your username" required>

                <label for="loginPassword">Password</label>
                <input type="password" id="loginPassword" placeholder="Enter your password" required>

                <button type="submit" class="primary-button">Log In</button>

                <button type="button" class="text-button" id="showForgot">
                    Forgot password?
                </button>
            </form>

            <form id="registerForm" class="auth-form hidden">
                <label for="registerName">Full Name</label>
                <input type="text" id="registerName" placeholder="Enter your full name" required>

                <label for="registerUsername">Username</label>
                <input type="text" id="registerUsername" placeholder="Create a username" required>

                <label for="registerPassword">Password</label>
                <input type="password" id="registerPassword" placeholder="Create a password" required>

                <label for="confirmPassword">Confirm Password</label>
                <input type="password" id="confirmPassword" placeholder="Enter your password again" required>

                <button type="submit" class="primary-button">Create Account</button>
            </form>

            <form id="forgotForm" class="auth-form hidden">
                <p class="small-note">
                    Enter your username and create a new password.
                </p>

                <label for="forgotUsername">Username</label>
                <input type="text" id="forgotUsername" placeholder="Enter your username" required>

                <label for="newPassword">New Password</label>
                <input type="password" id="newPassword" placeholder="Create a new password" required>

                <label for="confirmNewPassword">Confirm New Password</label>
                <input type="password" id="confirmNewPassword" placeholder="Repeat your new password" required>

                <button type="submit" class="primary-button">Reset Password</button>

                <button type="button" class="text-button" id="backToLogin">
                    Back to Log In
                </button>
            </form>

            <p id="authMessage" class="message"></p>
            <p class="footer-note">Made with love, just for you ♡</p>
        </section>
    </main>

</body>
</html>
